<!doctype html>
<html data-theme="dark">
<meta charset="utf-8">
<link rel="stylesheet" href="../../../brand/tokens.css">
<style>
@font-face { font-family: "Atkinson Hyperlegible Next"; src: url("../../../brand/fonts/atkinson-hyperlegible-next-latin-wght-normal.woff2") format("woff2"); font-weight: 200 800; }
@font-face { font-family: "JetBrains Mono"; src: url("../../../brand/fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2"); font-weight: 100 800; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--surface-base); color: var(--ink); font-family: var(--font-text); }
#stage { position: relative; width: 1920px; height: 1080px; background: radial-gradient(ellipse 1400px 700px at 50% 38%, var(--surface-panel), var(--surface-base) 70%); }
#brand { position: absolute; left: 120px; top: 56px; height: 54px; }
#stamp { position: absolute; right: 120px; top: 66px; font: 500 28px var(--font-mono); color: var(--ink-3); }
#scene { position: absolute; left: 120px; top: 150px; width: 1680px; height: 690px; }
#cap { position: absolute; left: 0; bottom: 0; width: 1920px; height: 240px; border-top: 2px solid var(--rule); background: var(--surface-panel); padding: 30px 120px; font: 600 62px/1.2 var(--font-text); color: var(--ink); display: flex; align-items: flex-start; }
#cap.off { display: none; }
.mono { font-family: var(--font-mono); }
.abs { position: absolute; }
.k { font: 500 36px var(--font-mono); color: var(--ink-3); }
.g { font: 500 34px var(--font-mono); padding: 2px 14px; border: 3px solid currentColor; border-radius: 6px; background: var(--surface-panel); white-space: nowrap; display: inline-block; }
.bad { color: var(--g-contradicted); } .ok { color: var(--g-observed); } .warn { color: var(--g-inferred); } .acc { color: var(--accent); }
.card { position: absolute; width: 500px; height: 100px; border: 2px solid var(--rule); border-radius: 10px; background: var(--surface-raised); font: 700 52px/96px var(--font-text); padding: 0 28px; white-space: nowrap; }
.chip { font: 500 52px var(--font-mono); border: 2px solid var(--rule); background: var(--surface-raised); border-radius: 6px; padding: 10px 24px; display: inline-block; white-space: nowrap; }
.node { position: absolute; transform: translate(-50%, -50%); font: 600 46px var(--font-mono); border: 2px solid var(--ink-3); background: var(--surface-raised); border-radius: 999px; padding: 10px 32px; white-space: nowrap; }
</style>
<div id="stage">
  <img id="brand" src="../../../brand/logo/lockup-dark.svg" alt="">
  <div id="stamp"></div>
  <div id="scene"></div>
  <div id="cap"></div>
</div>
<script type="module" src="film.mjs"></script>
